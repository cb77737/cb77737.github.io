<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion Tesla</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f5f5f7;font:15px -apple-system,system-ui,sans-serif}
.c{max-width:460px;padding:28px;border-radius:22px;background:#1c1c1f;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
h1{font-size:20px;margin:0 0 6px}p{color:#a1a1a6;margin:0 0 18px}
code{display:block;word-break:break-all;background:#2c2c2e;padding:12px;border-radius:12px;font-size:12px;margin-bottom:14px;user-select:all}
button{border:0;border-radius:12px;padding:11px 18px;background:#0a84ff;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
</style></head><body><div class="c">
<h1 id="t">Code de connexion</h1><p id="s">Copie ce code et colle-le dans les réglages du widget (champ « Code Tesla »).</p>
<code id="code">—</code><button id="b">Copier le code</button></div>
<script>
var p = new URLSearchParams(location.search), c = p.get('code'), e = p.get('error');
if (c) document.getElementById('code').textContent = c;
else { document.getElementById('t').textContent = 'Pas de code'; document.getElementById('s').textContent = e ? 'Tesla a répondu : ' + e : 'Lance la connexion depuis le widget.'; document.getElementById('b').style.display = 'none'; }
document.getElementById('b').onclick = function () { navigator.clipboard.writeText(c).then(function () { document.getElementById('b').textContent = 'Copié ✓'; }); };
</script></body></html>
